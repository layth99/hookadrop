<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HookaDrop – Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--mute:#9aa1a9;--fl:201,162,39;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%;background:#050505;color:#fff;font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body{display:grid;place-items:center}
*{box-sizing:border-box}
.screen{position:relative;overflow:hidden;background:#111;width:100%;max-width:390px;height:100%;max-height:844px;isolation:isolate}
@media(min-width:481px){.screen{border-radius:30px;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 30px 80px rgba(0,0,0,.7)}}
.L{position:absolute;inset:0;pointer-events:none}
/* smoke bg (screen blend + theme tint) */
.smkw{isolation:isolate;opacity:0}.play .smkw{animation:fade 1.4s ease-out forwards}
.smkw img{position:absolute;left:-10%;top:-10%;width:120%;height:120%;object-fit:cover;mix-blend-mode:screen;will-change:transform}
.sA{opacity:.6;animation:sa 22s ease-in-out infinite alternate}
.sB{opacity:.42;transform:scaleX(-1);animation:sb 31s ease-in-out infinite alternate}
@keyframes sa{from{transform:translateY(4%) scale(1.1) rotate(-2deg)}to{transform:translateY(-4%) scale(1.24) rotate(2deg)}}
@keyframes sb{from{transform:scaleX(-1) translate(-2%,-3%) scale(1.22) rotate(2deg)}to{transform:scaleX(-1) translate(2%,3%) scale(1.08) rotate(-2deg)}}
.tint{background:rgb(var(--fl));mix-blend-mode:color;opacity:.75}
@keyframes fade{to{opacity:1}}
/* orbs + aura */
.orbs{opacity:0}.play .orbs{animation:fade 1.6s .2s ease-out forwards}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(var(--fl),.34),rgba(var(--fl),0) 68%)}
.o1{width:340px;height:340px;left:-120px;top:4%;animation:d1 13s ease-in-out infinite alternate}
.o2{width:300px;height:300px;right:-130px;top:34%;animation:d2 17s ease-in-out infinite alternate}
.o3{width:380px;height:380px;left:18%;bottom:-170px;animation:d3 15s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(90px,120px) scale(1.25)}}@keyframes d2{to{transform:translate(-110px,-90px) scale(.85)}}@keyframes d3{to{transform:translate(-80px,-70px) scale(1.2)}}
.aura{left:calc(50% - 190px);top:calc(40% - 190px);width:380px;height:380px;inset:auto;left:calc(50% - 190px);background:radial-gradient(circle,rgba(var(--fl),.34),rgba(var(--fl),.12) 42%,rgba(var(--fl),0) 70%);opacity:0;transform:scale(.4)}
.play .aura{animation:auraIn 1.6s .6s cubic-bezier(.22,1,.36,1) forwards,breathe 5s 2.2s ease-in-out infinite alternate}
@keyframes auraIn{to{opacity:1;transform:scale(1)}}@keyframes breathe{from{filter:brightness(.8)}to{filter:brightness(1.4)}}
.scrim{background:linear-gradient(transparent 55%,rgba(5,5,6,.85))}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* centre: rings + logo */
.center{position:absolute;left:calc(50% - 140px);top:calc(40% - 140px);width:280px;height:280px}
.ember{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:radial-gradient(#fff,rgb(var(--fl)) 40%,transparent 70%);opacity:0}
.play .ember{animation:em 1.1s .2s ease-out forwards}
@keyframes em{0%{opacity:0;transform:scale(0)}35%{opacity:1;transform:scale(1)}60%{opacity:1;transform:scale(1.5)}100%{opacity:0;transform:scale(10)}}
.ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc{fill:none;stroke:rgb(var(--fl));stroke-width:1.6;stroke-linecap:round;stroke-dasharray:654;stroke-dashoffset:654;transform-origin:110px 110px;transform:rotate(-90deg);filter:drop-shadow(0 0 6px rgba(var(--fl),.9))}
.play .arc{animation:draw 1.3s .6s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dash{fill:none;stroke:rgba(255,255,255,.5);stroke-width:1;stroke-dasharray:1.5 9;stroke-linecap:round;transform-origin:110px 110px;opacity:0}
.play .dash{animation:fade .8s 1.6s forwards,spin 26s linear infinite reverse}
.orbit{transform-origin:110px 110px;opacity:0}.orbit circle{fill:#fff;filter:drop-shadow(0 0 6px rgb(var(--fl))) drop-shadow(0 0 12px rgb(var(--fl)))}
.play .orbit{animation:fade .5s 1.7s forwards,spin 3.4s 1.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lw{position:absolute;left:24px;top:14px;width:232px;height:252px}
.play .lw{animation:flt 4.2s 2.2s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-5px)}}
.lw img{width:100%;height:100%;object-fit:contain;opacity:0;filter:drop-shadow(0 0 18px rgba(var(--fl),.35))}
.play .lw img{animation:logoIn 1.3s .8s cubic-bezier(.22,1,.36,1) forwards}
@keyframes logoIn{from{opacity:0;transform:scale(.7);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
.shine{position:absolute;inset:0;border-radius:50%;overflow:hidden;mix-blend-mode:overlay}
.shine:before{content:"";position:absolute;top:-10%;bottom:-10%;width:45%;left:-60%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.95),transparent)}
.play .shine:before{animation:sw 5s 2.4s ease-in-out infinite}
@keyframes sw{0%{left:-60%}28%,100%{left:130%}}
.shock{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:2px solid rgba(var(--fl),.9);box-shadow:0 0 24px rgba(var(--fl),.6),inset 0 0 24px rgba(var(--fl),.35);animation:sk 1.2s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes sk{from{transform:scale(.3);opacity:.9}to{transform:scale(3.4);opacity:0}}
/* brand */
.brand{position:absolute;left:0;right:0;top:calc(40% + 156px);text-align:center}
.wm{display:none;font-size:23px;font-weight:800;letter-spacing:.7em;margin-right:-.7em;white-space:nowrap}
.play .wm{animation:trk 1.6s 1.5s cubic-bezier(.22,1,.36,1) forwards}
@keyframes trk{to{letter-spacing:.26em;margin-right:-.26em}}
.wm span{display:inline-block;opacity:0;transform:translateY(16px);filter:blur(8px)}
.play .wm span{animation:lt .9s cubic-bezier(.22,1,.36,1) forwards;animation-delay:calc(1.5s + var(--i)*.07s)}
@keyframes lt{to{opacity:1;transform:none;filter:blur(0)}}
.wm .d{color:rgb(var(--fl));text-shadow:0 0 18px rgba(var(--fl),.55)}
.tag{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);opacity:0}
.play .tag{animation:fade .9s 2.4s forwards}
.tag:before,.tag:after{content:"";width:34px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4));transform:scaleX(0);transform-origin:right}
.tag:after{transform:scaleX(0) scaleX(-1);transform-origin:left;}
.play .tag:before{animation:ln .9s 2.5s forwards}.play .tag:after{animation:ln2 .9s 2.5s forwards}
@keyframes ln{to{transform:scaleX(1)}}@keyframes ln2{to{transform:scaleX(-1)}}
/* loader */
.load{position:absolute;left:50%;bottom:calc(10% + 8px);width:min(260px,68%);margin-left:min(-130px,-34%);opacity:0}
.play .load{animation:fade .8s .5s forwards}
.row{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin-bottom:9px}
.row b{color:#fff;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.08em}
.track{height:3px;border-radius:3px;background:rgba(255,255,255,.09);position:relative}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,rgba(var(--fl),.15),rgb(var(--fl)));box-shadow:0 0 12px rgba(var(--fl),.7)}
.fill:after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px 3px rgb(var(--fl))}
/* exit */
.out .center,.out .brand{animation:outA .9s cubic-bezier(.5,0,.8,.4) forwards}
.out .load{animation:outL .4s forwards}
@keyframes outA{to{opacity:0;transform:scale(1.18);filter:blur(10px)}}@keyframes outL{to{opacity:0;transform:translateY(12px)}}
.veil{background:#111;opacity:0}.out .veil{animation:fade .7s .5s ease forwards}
.endmsg{display:grid;place-items:center;text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);opacity:0;transition:opacity .6s}
.end .endmsg{opacity:1}
.rp{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:9;font:700 12px 'Manrope',system-ui,sans-serif;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:99px;padding:9px 16px;cursor:pointer;backdrop-filter:blur(8px)}
.rp:hover{background:rgba(255,255,255,.2)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important}}
.rays{inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(var(--fl),.08) 0 5deg,transparent 5deg 16deg);-webkit-mask-image:radial-gradient(circle,#000,transparent 58%);mask-image:radial-gradient(circle,#000,transparent 58%);opacity:0}
.play .rays{animation:fade 3s 1s forwards,spin 70s linear infinite}
.rosette{inset:auto;left:calc(50% - 290px);top:calc(40% - 290px);width:580px;height:580px;opacity:0}
.rosette g{opacity:.22}.play .rosette{animation:fade 3s 1.2s forwards,spin 140s linear infinite}
.fill{overflow:visible;background-size:60px 100%;background-image:linear-gradient(90deg,rgba(var(--fl),.15),rgb(var(--fl)))}
.fill:before{content:"";position:absolute;inset:0;border-radius:3px;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%) -100% 0/60% 100% no-repeat;animation:shm 1.6s linear infinite}
@keyframes shm{to{background-position:250% 0}}
.ring,.shock,.rosette,.rays,.ember{display:none!important}
.smkw{-webkit-mask-image:linear-gradient(#000 40%,rgba(0,0,0,.18) 100%);mask-image:linear-gradient(#000 40%,rgba(0,0,0,.18) 100%)}
.load{width:min(320px,84%);margin-left:calc(min(320px,84%)/-2);bottom:calc(9% + 8px)}
.row{align-items:flex-end;margin-bottom:12px}
.row span{font-size:11px;letter-spacing:.2em;color:#d3d8de;padding-bottom:4px}
.row b{font-size:28px;font-weight:800;letter-spacing:0;line-height:1;text-shadow:0 0 18px rgba(var(--fl),.75)}
.track{height:18px;border-radius:99px;background:linear-gradient(rgba(255,255,255,.03),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 2px 6px rgba(0,0,0,.7),0 0 0 1px rgba(0,0,0,.45),0 10px 28px rgba(var(--fl),.22)}
.track:before{content:"";position:absolute;inset:0;border-radius:99px;z-index:3;pointer-events:none;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(0,0,0,.5) calc(10% - 1px) 10%)}
.track:after{content:"";position:absolute;left:10px;right:10px;top:3px;height:5px;border-radius:99px;z-index:4;pointer-events:none;background:linear-gradient(rgba(255,255,255,.4),transparent)}
.fill{left:2px;top:2px;bottom:2px;max-width:calc(100% - 4px);border-radius:99px;overflow:hidden;background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.24) 0 8px,rgba(255,255,255,0) 8px 16px),linear-gradient(90deg,rgba(var(--fl),.55),rgb(var(--fl)));background-size:32px 100%,100% 100%;animation:stripe .9s linear infinite;box-shadow:0 0 20px rgba(var(--fl),.85),0 0 5px rgb(var(--fl))}
.fill:after{right:0;top:0;bottom:0;width:12px;height:auto;border-radius:99px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 14px 4px rgb(var(--fl))}
@keyframes stripe{from{background-position:0 0,0 0}to{background-position:32px 0,0 0}}
.track{display:none}
.hosew{display:block;width:100%;height:auto;overflow:visible}
#hose{filter:drop-shadow(0 0 5px rgb(var(--fl))) drop-shadow(0 0 12px rgba(var(--fl),.8))}
#hhead{filter:drop-shadow(0 0 6px rgb(var(--fl))) drop-shadow(0 0 14px rgb(var(--fl)))}
</style></head><body>
